<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da chapa</title>
<style>
:root{--v:#009C3B;--a:#FFDF00;--z:#002776;--bg:#F2F7F3;--line:#D3E1D7;--ink:#0B1B3F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,'Segoe UI',sans-serif}
header{background:var(--z);color:#fff;padding:16px 16px 0;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--v)}
.top{display:flex;align-items:center;gap:14px;max-width:960px;margin:auto}
.mark{width:46px;height:46px;background:var(--v);border-radius:12px;display:grid;place-items:center;flex:none;animation:spin 14s linear infinite}
.mark i{width:26px;height:26px;background:var(--a);transform:rotate(45deg);display:grid;place-items:center;border-radius:3px}
.mark i::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--z)}
@keyframes spin{50%{transform:rotate(8deg) scale(1.08)}}
h1{font-size:1.15rem;margin:0}.top p{margin:0;font-size:.85rem;opacity:.8}
.top .sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;max-width:960px;margin:14px auto 0}
nav button{border:0;background:transparent;color:#fff;padding:10px 16px;font:600 .95rem system-ui,sans-serif;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap;transition:background .2s}
nav button:hover{background:rgba(255,255,255,.12)}
nav button.on{background:var(--bg);color:var(--z);box-shadow:inset 0 4px var(--a)}
main{max-width:960px;margin:auto;padding:22px 16px 90px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h2{margin:0 0 4px;font-size:1.5rem;color:var(--z)}.hint{color:#4C5C7A;margin:0 0 20px}
.f{display:block;margin:0 0 14px}.f span{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}
input,textarea,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:none;border-color:var(--v);box-shadow:0 0 0 4px rgba(0,156,59,.2)}
input[type=color]{padding:2px;height:44px;width:64px}
.btn{border:0;background:var(--v);color:#fff;padding:11px 20px;border-radius:99px;font:600 .95rem system-ui,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px);background:#00822F}.btn:active{transform:scale(.95)}
.btn.y{background:var(--a);color:var(--z)}.btn.y:hover{background:#F2D200}
.btn.o{background:#fff;color:var(--z);border:2px solid var(--z)}.btn.d{background:#fff;color:#B3261E;border:2px solid #F1C7C4}
.btn.s{padding:7px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details{background:#fff;border:2px solid var(--line);border-radius:18px;margin-bottom:10px;animation:in .35s both;overflow:hidden}
details[open]{border-color:var(--v)}
summary{padding:14px 18px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;list-style:none}
summary em{font-style:normal;font-size:.78rem;padding:3px 12px;border-radius:99px;color:#0B1B3F}
.g{padding:4px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g .w{grid-column:1/-1}
@media(max-width:600px){.g{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px;align-items:center;animation:in .3s both}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.logo{width:120px;height:120px;border:2px dashed var(--v);border-radius:20px;display:grid;place-items:center;background:#fff;overflow:hidden;color:var(--v);font-weight:600;text-align:center;font-size:.85rem}
.logo img{width:100%;height:100%;object-fit:contain}
.box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.msg{padding:12px 16px;border-radius:12px;margin-top:12px;background:#FFF6BF;animation:in .3s}.msg.ok{background:#CFEFD9}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--z);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;transform:translateY(100%);transition:transform .35s}
.bar.on{transform:none}
#lock[hidden]{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--z);display:grid;place-items:center;padding:20px}
#lock form{background:#fff;border-radius:28px;padding:32px;max-width:380px;width:100%;border-top:8px solid var(--v);animation:in .5s}
#lock h2{margin-bottom:6px}#lock input{margin:12px 0 6px}#lock .e{color:#B3261E;font-weight:600;min-height:1.4em;margin:0 0 12px}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
</style>
</head>
<body>
<div id="lock" hidden><form id="lf2"><div class="mark" style="margin-bottom:14px"><i></i></div><h2>Área da chapa</h2><p class="hint" style="margin:0">Digite a senha para entrar no painel.</p><input type="password" id="lpw" autocomplete="off" aria-label="Senha"><p class="e" id="le"></p><button class="btn" type="submit">Entrar</button></form></div>
<header>
  <div class="top"><div class="mark"><i></i></div><div><h1>Painel da chapa</h1><p id="sub">Edite e publique o site</p></div><div class="sp"></div>
  <a class="btn y s" href="index.html" style="text-decoration:none">Ver site</a><button class="btn o s" id="out" style="margin-left:8px">Sair</button></div>
  <nav id="nav"></nav>
</header>
<main id="m"><p class="hint">Carregando…</p></main>
<div class="bar" id="bar"><span id="bt">Você tem alterações não salvas</span><button class="btn y s" id="sv" data-act="save">Salvar na planilha</button></div>

<script>
var SHEET_URL='https://script.google.com/macros/s/AKfycbyX5cXrAa7Y1HoYpFKi_6tfzPIOGcBZWhSTXmDeLAJo5fda8CAhbP0em6aYtv4zn0LH/exec';
var PW='';try{PW=sessionStorage.getItem('adm_pw')||''}catch(e){}
function api(o){return fetch(SHEET_URL,{method:'POST',body:JSON.stringify(o)}).then(function(r){return r.json()})}
function trava(m){document.getElementById('lock').hidden=false;document.getElementById('le').textContent=m||''}
document.getElementById('lf2').addEventListener('submit',function(e){e.preventDefault();var f=e.target;PW=document.getElementById('lpw').value;
  document.getElementById('le').textContent='Verificando…';
  api({acao:'ler',senha:PW}).then(function(r){
    if(r.ok){try{sessionStorage.setItem('adm_pw',PW)}catch(x){}document.getElementById('lock').hidden=true;load(r.dados)}
    else{PW='';document.getElementById('le').textContent=r.erro||'Senha incorreta.';f.classList.remove('shake');f.offsetWidth;f.classList.add('shake')}
  }).catch(function(){document.getElementById('le').textContent='Erro de conexão. Tente novamente.'})});

if(!PW)trava();else api({acao:'ler',senha:PW}).then(function(r){if(r.ok)load(r.dados);else trava(r.erro)});

function load(D){
  var tabs=['Chapa','Propostas','Áreas','Cronograma','Diretoria','Pilares'],tab=0;
  var nav=document.getElementById('nav'),main=document.getElementById('m');
  nav.innerHTML=tabs.map(function(t,i){return '<button'+(i===tab?' class="on"':'')+' data-i="'+i+'">'+t+'</button>'}).join('');
  
  function render(){
    nav.querySelectorAll('button').forEach(function(b,i){b.classList.toggle('on',i===tab)});
    if(tab===0){
      main.innerHTML='<h2>Identidade da chapa</h2><p class="hint">Nome, lema, palavras animadas e slogan principal.</p>'+
      '<div class="box"><div class="f"><span>Nome da chapa</span><input id="cn" value="'+(D.chapa.nome||'')+'"></div>'+
      '<div class="f"><span>Lema (início da frase)</span><input id="cl" value="'+(D.chapa.lema||'')+'"></div>'+
      '<div class="f"><span>Palavras animadas (separadas por vírgula)</span><input id="cp" value="'+(D.chapa.palavras||[]).join(', ')+'"></div>'+
      '<div class="f"><span>Frase de impacto</span><input id="cf" value="'+(D.chapa.frase||'')+'"></div>'+
      '<div class="f"><span>URL do Logo</span><input id="cg" value="'+(D.chapa.logo||'')+'"></div></div>';
    }else if(tab===1){
      main.innerHTML='<h2>Propostas</h2><p class="hint">Gerencie as propostas apresentadas no site.</p><div id="pl"></div><button class="btn s" id="addP">+ Adicionar proposta</button>';
      renderPropostas();
    }else if(tab===2){
      main.innerHTML='<h2>Áreas e Cores</h2><p class="hint">Personalize as áreas e suas respectivas cores em HEX.</p><div id="al"></div><button class="btn s" id="addA">+ Adicionar área</button>';
      renderAreas();
    }else if(tab===3){
      main.innerHTML='<h2>Cronograma</h2><p class="hint">Prazos e etapas da chapa.</p><div id="cr"></div><button class="btn s" id="addC">+ Adicionar etapa</button>';
      renderCronograma();
    }else if(tab===4){
      main.innerHTML='<h2>Diretoria</h2><p class="hint">Membros e cargos da gestão.</p><div id="dr"></div><button class="btn s" id="addD">+ Adicionar membro</button>';
      renderDiretoria();
    }else if(tab===5){
      main.innerHTML='<h2>Pilares</h2><p class="hint">Os três pilares fundamentais da chapa.</p><div id="pi"></div>';
      renderPilares();
    }
  }

  function renderPropostas(){
    var h='';
    (D.propostas||[]).forEach(function(p,i){
      h+='<details><summary><span><strong>#'+p.id+'</strong> — '+p.t+' <em>'+p.a+'</em></span><button class="btn d s" data-del="p" data-idx="'+i+'">Excluir</button></summary>'+
      '<div class="g"><div class="f"><span>ID numérico</span><input type="number" data-k="propostas" data-idx="'+i+'" data-f="id" value="'+p.id+'"></div>'+
      '<div class="f"><span>Área</span><input data-k="propostas" data-idx="'+i+'" data-f="a" value="'+p.a+'"></div>'+
      '<div class="f"><span>Ícone (Emoji)</span><input data-k="propostas" data-idx="'+i+'" data-f="i" value="'+p.i+'"></div>'+
      '<div class="f"><span>Título</span><input data-k="propostas" data-idx="'+i+'" data-f="t" value="'+p.t+'"></div>'+
      '<div class="w f"><span>Subtítulo</span><input data-k="propostas" data-idx="'+i+'" data-f="s" value="'+p.s+'"></div>'+
      '<div class="w f"><span>Detalhes (separados por | )</span><textarea data-k="propostas" data-idx="'+i+'" data-f="d">'+(Array.isArray(p.d)?p.d.join(' | '):p.d)+'</textarea></div>'+
      '<div class="w f"><span>Prazo / Quando</span><input data-k="propostas" data-idx="'+i+'" data-f="w" value="'+p.w+'"></div></div></details>';
    });
    document.getElementById('pl').innerHTML=h;
  }

  function renderAreas(){
    var h='';
    Object.keys(D.areas||{}).forEach(function(k,i){
      h+='<div class="arow"><input data-area-k="'+i+'" value="'+k+'"><input type="color" data-area-v="'+i+'" value="'+D.areas[k]+'"><button class="btn d s" data-del="a" data-name="'+k+'">Excluir</button></div>';
    });
    document.getElementById('al').innerHTML=h;
  }

  function renderCronograma(){
    var h='';
    (D.cronograma||[]).forEach(function(c,i){
      h+='<div class="line"><input data-k="cronograma" data-idx="'+i+'" data-f="0" value="'+c[0]+'"><input data-k="cronograma" data-idx="'+i+'" data-f="1" value="'+c[1]+'"><button class="btn d s" data-del="c" data-idx="'+i+'">Excluir</button></div>';
    });
    document.getElementById('cr').innerHTML=h;
  }

  function renderDiretoria(){
    var h='';
    (D.diretoria||[]).forEach(function(d,i){
      h+='<div class="line"><input data-k="diretoria" data-idx="'+i+'" data-f="0" value="'+d[0]+'"><input data-k="diretoria" data-idx="'+i+'" data-f="1" value="'+d[1]+'"><button class="btn d s" data-del="d" data-idx="'+i+'">Excluir</button></div>';
    });
    document.getElementById('dr').innerHTML=h;
  }

  function renderPilares(){
    var h='';
    (D.pilares||[]).forEach(function(p,i){
      h+='<div class="box"><div class="g"><div class="f"><span>Título</span><input data-k="pilares" data-idx="'+i+'" data-f="t" value="'+p.t+'"></div>'+
      '<div class="f"><span>Subtítulo</span><input data-k="pilares" data-idx="'+i+'" data-f="s" value="'+p.s+'"></div>'+
      '<div class="f"><span>Emoji</span><input data-k="pilares" data-idx="'+i+'" data-f="e" value="'+p.e+'"></div>'+
      '<div class="f"><span>Cor (HEX)</span><input data-k="pilares" data-idx="'+i+'" data-f="c" value="'+p.c+'"></div></div></div>';
    });
    document.getElementById('pi').innerHTML=h;
  }

  nav.onclick=function(e){var b=e.target.closest('button');if(!b)return;tab=+b.dataset.i;render()};

  main.oninput=function(e){
    var t=e.target;
    if(t.id==='cn')D.chapa.nome=t.value;
    if(t.id==='cl')D.chapa.lema=t.value;
    if(t.id==='cp')D.chapa.palavras=t.value.split(',').map(function(s){return s.trim()});
    if(t.id==='cf')D.chapa.frase=t.value;
    if(t.id==='cg')D.chapa.logo=t.value;

    var k=t.dataset.k,idx=+t.dataset.idx,f=t.dataset.f;
    if(k && !isNaN(idx)){
      if(k==='propostas'){if(f==='d')D[k][idx][f]=t.value.split('|').map(function(s){return s.trim()});else D[k][idx][f]=t.value}
      else if(k==='cronograma'||k==='diretoria'){D[k][idx][+f]=t.value}
      else if(k==='pilares'){D[k][idx][f]=t.value}
    }
    document.getElementById('bar').classList.add('on');
  };

  main.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='addP'){D.propostas.push({id:D.propostas.length+1,a:'Gestão',i:'💡',t:'Nova proposta',s:'Subtítulo da proposta',d:['Detalhe 1'],w:'Durante o mandato'});renderPropostas();document.getElementById('bar').classList.add('on')}
    if(b.id==='addA'){var nome='Nova Área';D.areas[nome]='#7F8BFF';renderAreas();document.getElementById('bar').classList.add('on')}
    if(b.id==='addC'){D.cronograma.push(['Prazo','Descrição']);renderCronograma();document.getElementById('bar').classList.add('on')}
    if(b.id==='addD'){D.diretoria.push(['Cargo','Nome']);renderDiretoria();document.getElementById('bar').classList.add('on')}

    var del=b.dataset.del;
    if(del){
      var idx=+b.dataset.idx;
      if(del==='p')D.propostas.splice(idx,1),renderPropostas();
      if(del==='c')D.cronograma.splice(idx,1),renderCronograma();
      if(del==='d')D.diretoria.splice(idx,1),renderDiretoria();
      if(del==='a'){delete D.areas[b.dataset.name];renderAreas()}
      document.getElementById('bar').classList.add('on');
    }
  };

  document.getElementById('sv').onclick=function(){
    var btn=this;btn.textContent='Salvando...';
    api({acao:'salvar',senha:PW,dados:D}).then(function(r){
      if(r.ok){btn.textContent='Salvo com sucesso!';document.getElementById('bar').classList.remove('on');setTimeout(function(){btn.textContent='Salvar na planilha'},2000)}
      else{btn.textContent='Erro ao salvar';alert(r.erro||'Erro desconhecido')}
    }).catch(function(){btn.textContent='Erro de conexão'});
  };

  document.getElementById('out').onclick=function(){sessionStorage.removeItem('adm_pw');location.reload()};
  render();
}
</script>
</body>
</html>
